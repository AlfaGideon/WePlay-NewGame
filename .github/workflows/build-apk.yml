name: Build Android APK & Publish OTA Release

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compute Version
        id: ver
        run: |
          VC=$((110 + GITHUB_RUN_NUMBER))
          VN="1.1.${GITHUB_RUN_NUMBER}"
          echo "code=${VC}" >> "$GITHUB_OUTPUT"
          echo "name=${VN}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}" >> "$GITHUB_OUTPUT"

      - name: Decode Private Permanent Signing Key (if configured in Secrets)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.OTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using private permanent signing key from GitHub Secrets"
            printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > "${RUNNER_TEMP}/permanent-ota.p12"
            echo "keystore_path=${RUNNER_TEMP}/permanent-ota.p12" >> "$GITHUB_OUTPUT"
            echo "label=Приватный постоянный ключ (GitHub Secrets)" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets not set yet — using built-in universal-ota.p12 fallback"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "label=Универсальный встроенный ключ (fallback)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest -PappVersionCode=${{ steps.ver.outputs.code }} -PappVersionName=${{ steps.ver.outputs.name }} --stacktrace 2>&1 | tee /tmp/test.log; then
            ERR=$(grep -E "FAILURE:|What went wrong:|> |e: file:" /tmp/test.log | tail -n 12 | tr '\n' ' ')
            echo "::error::Gradle testDebugUnitTest failed: ${ERR}"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          OTA_KEYSTORE_PATH: ${{ steps.sign.outputs.keystore_path }}
          OTA_KEYSTORE_TYPE: PKCS12
          OTA_KEYSTORE_PASS: ${{ secrets.OTA_KEYSTORE_PASS }}
          OTA_KEY_ALIAS: ${{ secrets.OTA_KEY_ALIAS }}
          OTA_KEY_PASS: ${{ secrets.OTA_KEY_PASS }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease -PappVersionCode=${{ steps.ver.outputs.code }} -PappVersionName=${{ steps.ver.outputs.name }} --stacktrace 2>&1 | tee /tmp/release.log; then
            ERR=$(grep -E "FAILURE:|What went wrong:|> |e: file:" /tmp/release.log | tail -n 12 | tr '\n' ' ')
            echo "::error::Gradle assembleRelease failed: ${ERR}"
            exit 1
          fi

      - name: Verify APK Signing Certificate Fingerprint
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner:|SHA256:" || true

      - name: Prepare APK Output
        run: |
          mkdir -p apk_out
          cp app/build/outputs/apk/release/app-release.apk "apk_out/CardTycoonHelper-v${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "apk_out/CardTycoonHelper-latest.apk"
          ls -lh apk_out/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardTycoonHelper-APK
          path: apk_out/CardTycoonHelper-v${{ steps.ver.outputs.name }}.apk
          retention-days: 30

      - name: Publish GitHub Release for OTA Auto-Updates
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          APK="apk_out/CardTycoonHelper-v${{ steps.ver.outputs.name }}.apk"
          NOTES="versionCode: ${{ steps.ver.outputs.code }}
          Версия ${{ steps.ver.outputs.name }} · Подпись: ${{ steps.sign.outputs.label }}
          Изменения:
          - Поддержка приватного постоянного ключа подписи через GitHub Secrets (OTA_KEYSTORE_BASE64)
          - Обновление по воздуху (OTA) прямо из приложения
          - Точная привязка подсветки карт и клеток (исправлен сдвиг выреза/статус-бара)
          - Рекомендации фиксируются только на вашем ходу (без прыжков во время чужих ходов)
          - Улучшенный OCR карт (сплошная заливка + консенсус 2 кадров, только реальные карты в руке)
          - Обновлены правила: Барабан x1–x4, Бомба (больница 2 хода), Какашка (-деньги), Мешок с риском ловушек"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "${{ github.sha }}" \
              --title "Карточный Советник ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
