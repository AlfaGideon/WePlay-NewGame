name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for download
        run: |
          mkdir -p apk_out
          cp app/build/outputs/apk/debug/app-debug.apk apk_out/CardTycoonHelper-debug.apk
          ls -lh apk_out/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardTycoonHelper-APK
          path: apk_out/CardTycoonHelper-debug.apk
          retention-days: 30
